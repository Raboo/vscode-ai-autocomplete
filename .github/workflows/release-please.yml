name: Release Please

on:
  push:
    branches: [main]
  # Manual re-run of the package and publish steps for an existing release tag (the release-please job is skipped).
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and publish, for example v1.4.0
        required: true
        type: string

permissions:
  contents: read

jobs:
  release-please:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # With RELEASE_PLEASE_TOKEN (a fine-grained PAT) the release PR runs CI like any PR, so it can merge itself once
      # `check` and `integration` pass: merging it tags the release and the vsix job below attaches the package.
      - name: Auto-merge the release PR
        if: steps.release.outputs.pr != ''
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.release.outputs.pr && fromJSON(steps.release.outputs.pr).number }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "No RELEASE_PLEASE_TOKEN secret: merge release PR #$PR_NUMBER by hand."
            exit 0
          fi
          gh pr merge "$PR_NUMBER" --auto --squash

  vsix:
    needs: release-please
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.release-please.outputs.release_created == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      marketplace_built: ${{ steps.marketplace.outputs.built }}
    steps:
      - name: Pick and validate the tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$INPUT_TAG"
          else
            tag="$RELEASE_TAG"
          fi
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag must look like v1.2.3."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.tag.outputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run package
      # Name the full package exactly: the -marketplace package never goes to the GitHub release.
      - run: gh release upload "$TAG" "ai-autocomplete-${TAG#v}.vsix" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.tag.outputs.tag }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vsix
          path: ai-autocomplete-*[0-9].vsix
          if-no-files-found: error
      # Tags from before the Marketplace build have no such script: they skip it.
      - name: Build the Marketplace package
        id: marketplace
        run: |
          if ! node -e 'process.exit(require("./package.json").scripts["package:marketplace"] ? 0 : 1)'; then
            echo "::notice::This tag has no package:marketplace script: no Marketplace package."
            exit 0
          fi
          npm run package:marketplace
          unzip -p ai-autocomplete-*-marketplace.vsix extension/package.json > "$RUNNER_TEMP/mp-package.json"
          if grep -q enabledApiProposals "$RUNNER_TEMP/mp-package.json"; then
            echo "::error::The Marketplace package declares enabledApiProposals."
            exit 1
          fi
          echo "built=true" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.marketplace.outputs.built == 'true'
        with:
          name: vsix-marketplace
          path: ai-autocomplete-*-marketplace.vsix
          if-no-files-found: error

  # Publishing runs from the workflow's own commit, so the ovsx version is the one pinned in this repo's lockfile even
  # when the tag being published is older and its lockfile has no ovsx. The .vsix is the one built by the vsix job.
  open-vsx:
    needs: vsix
    if: ${{ !cancelled() && needs.vsix.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vsix
      # The token comes only through the OVSX_PAT environment variable, which ovsx reads; it is never on a command line.
      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OPEN_VSX_TOKEN }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "::notice::No Open VSX token secret: skipping Open VSX. Publish by hand or re-run this workflow with the tag."
            exit 0
          fi
          shopt -s nullglob
          files=(ai-autocomplete-*.vsix)
          if [ "${#files[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one ai-autocomplete-*.vsix, found ${#files[@]}."
            exit 1
          fi
          # Creating the namespace fails when it exists already; that answer is fine, any other failure is not.
          if ! out=$(npx --no-install ovsx create-namespace raboo 2>&1); then
            if printf '%s' "$out" | grep -qi 'already exists'; then
              echo "Namespace raboo already exists."
            else
              printf '%s\n' "$out"
              exit 1
            fi
          fi
          npx --no-install ovsx publish "${files[0]}"

  # Marketplace Trusted Publishing: GitHub OIDC, no token or secret. The owner creates the policy on the Marketplace
  # and sets the repository variable MARKETPLACE_PUBLISH to true; until then this job skips.
  marketplace:
    needs: vsix
    if: ${{ !cancelled() && needs.vsix.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.vsix.outputs.marketplace_built == 'true'
        with:
          name: vsix-marketplace
      - name: Publish to the VS Code Marketplace
        env:
          MARKETPLACE_PUBLISH: ${{ vars.MARKETPLACE_PUBLISH }}
        run: |
          if [ "$MARKETPLACE_PUBLISH" != "true" ]; then
            echo "::notice::MARKETPLACE_PUBLISH is not true: skipping the Marketplace. See docs/PUBLISHING.md."
            exit 0
          fi
          shopt -s nullglob
          files=(ai-autocomplete-*-marketplace.vsix)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::notice::No vsix-marketplace artifact (the vsix job built none: a tag from before the Marketplace build): skipping the Marketplace."
            exit 0
          fi
          if [ "${#files[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one ai-autocomplete-*-marketplace.vsix, found ${#files[@]}."
            exit 1
          fi
          npx --no-install vsce publish --oidc --packagePath "${files[0]}"
